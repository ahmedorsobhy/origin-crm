<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Origin Real Estate CRM</title>
  <style>
    html, body { margin: 0; padding: 0; background: #F5F1E8; -webkit-text-size-adjust: 100%; }
    #root { max-width: 1100px; margin: 20px auto; }
    * { box-sizing: border-box; }
    input, select, textarea, button { font-size: 16px; } /* prevents iOS zoom-on-focus */
    @media (max-width: 700px) {
      #root { margin: 0; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script src="bundle.js"></script>
</body>
</html>
